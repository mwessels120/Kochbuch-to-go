      <div><label class="l" for="e-t">Zeit (optional)</label><input class="input" id="e-t" data-f="t" placeholder="z. B. 15 Min." value="${esc(d.t)}"></div></div>
    <h4>Zutaten für 1 Portion</h4><div class="sub" style="margin-bottom:8px">Menge z. B. 150, 1,5, ½ oder 2–3</div>
    ${d.ing.map((x,i) => `<div class="erow"><input class="input" placeholder="Menge" aria-label="Menge" data-ing="${i}" data-k="a" value="${esc(x.a)}"><input class="input" placeholder="Einheit" aria-label="Einheit" data-ing="${i}" data-k="u" value="${esc(x.u)}"><input class="input" placeholder="Zutat" aria-label="Zutat" data-ing="${i}" data-k="n" value="${esc(x.n)}"><button class="del" data-act="ding" data-i="${i}" aria-label="Zutat entfernen">×</button></div>`).join("")}
    <button class="link" data-act="aing">+ Zutat hinzufügen</button>
    <h4>Zubereitung</h4>
    ${d.st.map((x,i) => `<div class="srow"><div><input class="input" placeholder="Kurztitel (optional)" aria-label="Kurztitel" data-st="${i}" data-k="t" value="${esc(x.t)}" style="margin-bottom:4px"><textarea class="input" rows="3" placeholder="Was ist zu tun?" aria-label="Schritt" data-st="${i}" data-k="x">${esc(x.x)}</textarea></div><button class="del" data-act="dst" data-i="${i}" aria-label="Schritt entfernen">×</button></div>`).join("")}
    <button class="link" data-act="ast">+ Schritt hinzufügen</button>`;
}
function saveOwn(){
  const d = draft;
  if (!d.name.trim()){ alert("Bitte einen Namen eingeben."); return; }
  const ing = d.ing.filter(x => (x.a+x.u+x.n).trim()).map(x => {
    const p = parseAmount(x.a);
    if (p === undefined) return [null, "", [x.a, x.u, x.n].map(s => s.trim()).filter(Boolean).join(" ")];
    return [p, x.u.trim(), x.n.trim()];
  });
  const r = {id: d.id || "eigen-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), cat:d.cat, ty:d.ty,
    kcal: parseInt(d.kcal, 10) || 0, t: d.t.trim(), name: d.name.trim(), g:[["Zutaten", ing]],
    s: d.st.filter(x => (x.t + x.x).trim()).map(x => [x.t.trim(), x.x.trim()])};
  const i = S.own.findIndex(o => o.id === r.id);
  if (i >= 0) S.own[i] = r; else S.own.push(r);
  save(); S.cat = r.cat; openRecipe(r.id); render();
}

/* ---------- Auswahl für Wochenplan ---------- */
let pick = null;
function openPicker(day, cat){ pick = {day, cat, q:""}; renderPicker(); openSheet(); }
function renderPicker(){
  document.getElementById("sheetBody").innerHTML = `
    <div class="sheet-bar"><button class="x" data-act="close">Abbrechen</button><b>${DAYS[pick.day]}</b></div>
    <h2 class="dt-h">${catName(pick.cat)} wählen</h2>
    <input class="input" id="pq" type="search" placeholder="Rezept suchen" aria-label="Rezept suchen" style="margin:8px 0">
    <ul class="list" id="plist"></ul>`;
  renderPickList();
}
function renderPickList(){
  const it = all().filter(r => r.cat === pick.cat && matches(r, pick.q));
  document.getElementById("plist").innerHTML = it.map(r => rowHTML(r, "pick")).join("") || `<li class="empty">Nichts gefunden.</li>`;
}

/* ---------- Kochmodus & Timer ---------- */
let cook = null, wakeLock = null, audioCtx = null;
async function keepAwake(on){
  try {
    if (on && "wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); }
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
function openCook(){
  const r = byId(cur); cook = {id:r.id, page:0, checked:new Set()};
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  renderCook(); document.getElementById("cook").showModal(); keepAwake(true);
}
function renderCook(){
  const r = byId(cook.id), total = r.s.length, p = cook.page, items = r.g.flatMap(g => g[1]);
  let body;
  if (p === 0){
    body = `<div class="cook-title">Zutaten bereitlegen</div><div class="sub">${portions} ${portions===1?"Portion":"Portionen"} · antippen zum Abhaken</div>
      <ul class="cook-ing">${items.map(([a,u,n],i) => `<li><button class="${cook.checked.has(i)?"done":""}" data-act="cchk" data-i="${i}"><b>${amt(a,u,portions)}</b> ${esc(n)}</button></li>`).join("")}</ul>`;
  } else {
    const [t,x] = r.s[p-1], m = timerMinutes(x);
    body = `<div class="cook-step">Schritt ${p} von ${total}</div>${t?`<div class="cook-title">${esc(t)}</div>`:""}<div class="cook-text">${esc(x)}</div>
      ${m ? `<button class="btn gold block" style="margin-top:18px;padding:16px;font-size:1.15rem" data-act="timer" data-m="${m}" data-l="${esc((t||"Schritt "+p))}">⏱ Timer ${dur(m)} starten</button>` : ""}`;
  }
  document.getElementById("cookBody").innerHTML = `
    <div class="sheet-bar"><button class="x" data-act="cookclose">Schließen</button><b style="text-align:right;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</b></div>
    <div class="prog"><i style="width:${total ? p/total*100 : 100}%"></i></div>
    <div class="cook-page" id="cookpage">${body}</div>
    <div class="timers" id="cooktimers"></div>
    <div class="cook-nav"><button class="btn soft" data-act="cprev" ${p===0?"disabled":""}>‹ Zurück</button>
      ${p < total ? `<button class="btn" data-act="cnext">${p===0?"Los geht’s":"Weiter ›"}</button>` : `<button class="btn" data-act="cookclose">Fertig ✓</button>`}</div>`;
  renderTimers();
}
function startTimer(min, label){
  const r = byId(cook.id);
  S.timers.push({id:Date.now()+Math.random(), label: r.name + ": " + label, end: Date.now() + min*60000, rung:false});
  try { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); } catch(e){}
  renderTimers();
}
function beep(){
  try {
    if (!audioCtx) return;
    [0, 0.35, 0.7].forEach(off => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.25, audioCtx.currentTime + off); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + off + 0.3);
      o.start(audioCtx.currentTime + off); o.stop(audioCtx.currentTime + off + 0.3);
    });
  } catch(e){}
}
function renderTimers(){
  const now = Date.now();
  const html = S.timers.map(t => {
    const rem = Math.max(0, Math.ceil((t.end - now)/1000));
    return `<div class="tmr ${rem===0?"ring":""}"><span>${rem===0?"🔔":"⏱"}</span><span class="lbl">${esc(t.label)}</span>
      <span class="t">${rem===0 ? "Fertig!" : Math.floor(rem/60) + ":" + String(rem%60).padStart(2,"0")}</span>
      <button class="x" data-act="tstop" data-id="${t.id}" aria-label="Timer beenden">×</button></div>`;
  }).join("");
  const box = document.getElementById("cooktimers"); if (box) box.innerHTML = html;
  const pill = document.getElementById("timerpill");
  if (S.timers.length && !document.getElementById("cook").open){
    const next = S.timers.slice().sort((a,b) => a.end - b.end)[0], rem = Math.max(0, Math.ceil((next.end - now)/1000));
    pill.hidden = false; pill.textContent = rem === 0 ? "🔔 Timer fertig!" : `⏱ ${Math.floor(rem/60)}:${String(rem%60).padStart(2,"0")} · ${S.timers.length} Timer`;
  } else pill.hidden = true;
}
setInterval(() => {
  if (!S.timers.length) return;
  const now = Date.now();
  S.timers.forEach(t => { if (!t.rung && t.end <= now){ t.rung = true; beep(); } });
  if (S.timers.some(t => t.end <= now && now - t.end < 60000 && (Math.floor((now - t.end)/1000) % 5 === 0))) beep();
  renderTimers();
}, 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && document.getElementById("cook").open) keepAwake(true); });

/* ---------- Sheets ---------- */
function openSheet(){ const d = document.getElementById("sheet"); if (!d.open) d.showModal(); d.querySelector(".sheet").scrollTop = 0; }
function closeSheet(){ const d = document.getElementById("sheet"); if (d.open) d.close(); }
document.getElementById("sheet").addEventListener("close", () => { render(); });
document.getElementById("cook").addEventListener("close", () => { keepAwake(false); renderTimers(); });

/* ---------- Ereignisse ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
  const a = b.dataset.act, id = b.dataset.id;
  switch (a){
    case "tab": S.view = id; render(); window.scrollTo(0,0); break;
    case "cat": S.cat = id; render(); break;
    case "open": openRecipe(id); break;
    case "close": closeSheet(); break;
    case "back": openRecipe(draft.id); break;
    case "new": openEditor(null); break;
    case "edit": openEditor(cur); break;
    case "delete": {
      const r = byId(cur);
      if (confirm(`„${r.name}“ wirklich löschen?`)){
        S.own = S.own.filter(o => o.id !== cur); S.favs.delete(cur);
        Object.keys(S.plan).forEach(k => { if (S.plan[k] === cur) delete S.plan[k]; });
        save(); closeSheet();
      }
      break;
    }
    case "fav": S.favs.has(cur) ? S.favs.delete(cur) : S.favs.add(cur); save(); renderDetail(); break;
    case "share": shareTextOut(byId(cur).name, shareText(byId(cur))); break;
    case "portion": portions = Math.min(12, Math.max(1, portions + +b.dataset.d)); renderDetail(); break;
    case "cook": openCook(); break;
    case "saveown": saveOwn(); break;
    case "aing": draft.ing.push({a:"",u:"",n:""}); renderEditor(); break;
    case "ding": draft.ing.splice(+b.dataset.i, 1); renderEditor(); break;
    case "ast": draft.st.push({t:"",x:""}); renderEditor(); break;
    case "dst": draft.st.splice(+b.dataset.i, 1); renderEditor(); break;
    case "pick": S.plan[pick.day + "|" + pick.cat] = id; save(); closeSheet(); break;
    case "swap": openPicker(+b.dataset.day, b.dataset.cat); break;
    case "unplan": delete S.plan[b.dataset.day + "|" + b.dataset.cat]; save(); render(); break;
    case "fill":
      for (let i = 0; i < 7; i++) ["fruehstueck","mittag","snack","abend"].forEach(c => {
        if (!S.plan[i+"|"+c]){ const o = all().filter(r => r.cat === c); S.plan[i+"|"+c] = o[Math.floor(Math.random()*o.length)].id; }
      });
      save(); render(); break;
    case "clearplan": if (confirm("Ganzen Wochenplan leeren?")){ S.plan = {}; S.checked = new Set(); save(); render(); } break;
    case "people": S.people = Math.min(10, Math.max(1, S.people + +b.dataset.d)); save(); render(); break;
    case "check": { const k = b.dataset.key; S.checked.has(k) ? S.checked.delete(k) : S.checked.add(k); save(); render(); break; }
    case "resetchecks": S.checked = new Set(); save(); render(); break;
    case "addextra": addExtra(); break;
    case "clearextras": S.extras = S.extras.filter(x => !S.checked.has("extra|"+x)); save(); render(); break;
    case "shareshop": {
      const l = ["Einkaufsliste (Kochbuch to Go)", ""];
      shopItems().filter(i => !S.checked.has(i.key)).forEach(i => l.push("• " + (i.amount ? i.amount + " " : "") + i.name));
      S.extras.filter(x => !S.checked.has("extra|"+x)).forEach(x => l.push("• " + x));
      shareTextOut("Einkaufsliste", l.join("\n")); break;
    }
    case "cprev": cook.page = Math.max(0, cook.page - 1); renderCook(); break;
    case "cnext": cook.page++; renderCook(); break;
    case "cchk": { const i = +b.dataset.i; cook.checked.has(i) ? cook.checked.delete(i) : cook.checked.add(i); renderCook(); break; }
    case "cookclose": document.getElementById("cook").close(); break;
    case "timer": startTimer(+b.dataset.m, b.dataset.l); break;
    case "tstop": S.timers = S.timers.filter(t => String(t.id) !== b.dataset.id); renderTimers(); break;
  }
});
document.getElementById("timerpill").addEventListener("click", () => {
  if (cook && byId(cook.id)){ renderCook(); document.getElementById("cook").showModal(); keepAwake(true); }
});
function addExtra(){
  const el = document.getElementById("extra"), v = el ? el.value.trim() : "";
  if (v && !S.extras.includes(v)){ S.extras.push(v); save(); }
  render(); const n = document.getElementById("extra"); if (n) n.focus();
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q"){ S.q = t.value; renderList(); }
  if (t.id === "pq"){ pick.q = t.value; renderPickList(); }
  if (t.dataset.f) draft[t.dataset.f] = t.value;
  if (t.dataset.ing !== undefined) draft.ing[+t.dataset.ing][t.dataset.k] = t.value;
  if (t.dataset.st !== undefined) draft.st[+t.dataset.st][t.dataset.k] = t.value;
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "ty"){ S.ty = t.value; renderList(); }
  if (t.dataset.act === "addmeal" && t.value){ openPicker(+t.dataset.day, t.value); t.value = ""; }
  if (t.dataset.act === "planday" && t.value !== ""){
    const r = byId(cur), d = +t.value; S.plan[d + "|" + r.cat] = r.id; save();
    document.getElementById("planned").textContent = `✓ Steht jetzt am ${DAYS[d]} im Wochenplan (${catName(r.cat)}).`; t.value = "";
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "extra"){ e.preventDefault(); addExtra(); } });
// Wischen im Kochmodus
let tx = null;
document.getElementById("cook").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive:true});
document.getElementById("cook").addEventListener("touchend", e => {
  if (tx === null || !cook) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  const total = byId(cook.id).s.length;
  if (dx < -60 && cook.page < total){ cook.page++; renderCook(); }
  if (dx > 60 && cook.page > 0){ cook.page--; renderCook(); }
}, {passive:true});

load(); render();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
</body>
</html>
